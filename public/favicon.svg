<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!--
        MomentDesk tab icon: the app's own logo mark — a stylised "M" whose centre dip
        forms a heart — reversed out of the brand violet→indigo gradient. Drawn on a
        rounded square so it still reads at 16px.
    -->
    <defs>
        <linearGradient id="momentdesk" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7c5cff" />
            <stop offset="1" stop-color="#4338ca" />
        </linearGradient>
    </defs>

    <rect width="64" height="64" rx="14" fill="url(#momentdesk)" />

    <g transform="translate(9.5 8.5) scale(1.13)">
        <path
            d="M 6 32 L 6 10 Q 6 8 8 8 Q 10 8 11 10 L 20 24 L 29 10 Q 30 8 32 8 Q 34 8 34 10 L 34 32"
            fill="none"
            stroke="#ffffff"
            stroke-width="5.5"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
        <path d="M 11 18 C 11 14 16 12 20 17 C 24 12 29 14 29 18 C 29 22 25 25 20 30 C 15 25 11 22 11 18 Z" fill="#ffffff" />
    </g>
</svg>
